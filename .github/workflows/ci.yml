name: CI

on:
  push:
    branches: [main, windows]
  pull_request:

permissions:
  contents: read

jobs:
  mac:
    name: Mac app (swift test)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: swift --version
      - name: Test the engine
        working-directory: core
        run: swift test
      - name: Test the Mac parts
        working-directory: mac
        run: swift test

  core-linux:
    # Keeps core/ portable beyond the two apps' systems.
    name: Engine on Linux (portability check)
    runs-on: ubuntu-latest
    container: swift:6.4.3
    steps:
      - uses: actions/checkout@v5
      - name: Test
        working-directory: core
        run: swift test

  windows:
    name: Windows (engine tests, bridge, camera, app)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: compnerd/gha-setup-swift@v0.5.1
        with:
          swift-version: swift-6.4.3-release
          swift-build: 6.4.3-RELEASE
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: swift --version
      - name: Test the engine
        working-directory: core
        run: swift test
      - name: Build the engine DLL
        working-directory: windows
        run: swift build
      - name: Build the camera DLL
        shell: cmd
        run: windows\Camera\build.cmd x64
      - name: Build the app
        working-directory: windows/App
        run: dotnet build -p:Platform=x64 -r win-x64

  android:
    name: Phone app (assembleDebug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        working-directory: android
        run: ./gradlew assembleDebug
