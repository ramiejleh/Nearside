name: Feature idea
description: Something Nearside could do.
labels: [idea]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What would you like to do with your phone and Mac, and why?
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: Optional. Another app, a workaround, or not at all.
