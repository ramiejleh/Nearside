name: Bug report
description: Something doesn't work as it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: Mac
      placeholder: MacBook Air M2, macOS 15.2
    validations:
      required: true
  - type: input
    id: phone
    attributes:
      label: Phone
      placeholder: Pixel 9 Pro, Android 17
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Setup and pairing
        - Connection (Wi-Fi or USB)
        - Clipboard
        - Notifications
        - Text messages
        - Files
        - Phone apps on the Mac
        - Something else
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        If you can: the helper's log (`adb shell cat /data/local/tmp/nearside-helper.log`) and the Mac app's
        (`/usr/bin/log show --last 10m --predicate 'subsystem == "dev.nearside.mac"'`). Remove anything personal first.
      render: text
